<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patching Roma…</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Lato',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; background:#faf8f5; gap:1rem; }
    h2   { color:#2a1a0e; }
    p    { color:#888; font-size:0.95rem; }
  </style>
</head>
<body>
  <h2 id="title">⏳ Patching stay…</h2>
  <p id="msg">Opening database…</p>

  <script src="db.js"></script>
  <script>
    (async () => {
      const titleEl = document.getElementById('title');
      const msgEl   = document.getElementById('msg');

      await TripDB.open();
      const all = await TripDB.getAll('stays');

      // Find by confirmation code, city, OR any "Roma/Rome" title
      const target = all.find(s =>
        s.confirmation === 'HMH298NMT5' ||
        /^Rom/i.test(s.city) ||
        /home in rom/i.test(s.propertyTitle)
      );

      if (!target) {
        // Last resort — show all stays so we can debug
        titleEl.textContent = '⚠️ Record not found';
        msgEl.textContent   = `Found ${all.length} stay(s). Check the list below and open patch-roma.html again.`;
        const pre = document.createElement('pre');
        pre.style.cssText = 'font-size:0.75rem;background:#f5f0e8;padding:1rem;border-radius:8px;max-width:90vw;overflow:auto;text-align:left';
        pre.textContent = JSON.stringify(all.map(s => ({ id: s.id, city: s.city, propertyTitle: s.propertyTitle, confirmation: s.confirmation })), null, 2);
        document.body.appendChild(pre);
        return;
      }

      target.propertyTitle = 'Home in Taormina';
      target.host          = 'Hotel Villa Paradiso';
      target.city          = 'Taormina';

      await TripDB.update('stays', target);

      titleEl.textContent = '✅ Done!';
      msgEl.textContent   = `Updated to "${target.propertyTitle}" — redirecting…`;

      setTimeout(() => window.location.href = 'stays.html', 1500);
    })();
  </script>
</body>
</html>
