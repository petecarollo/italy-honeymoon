<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patching Taormina…</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Lato',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; background:#faf8f5; gap:1rem; }
    h2 { color:#2a1a0e; } p { color:#888; font-size:0.95rem; }
  </style>
</head>
<body>
  <h2 id="title">⏳ Patching Taormina…</h2>
  <p id="msg">Opening database…</p>
  <script src="db.js"></script>
  <script>
    (async () => {
      await TripDB.open();
      const all = await TripDB.getAll('stays');

      const target = all.find(s =>
        /taormin/i.test(s.city) ||
        /taormin/i.test(s.propertyTitle) ||
        /villa\s+paradiso/i.test(s.host) ||
        /^Rom/i.test(s.city) ||
        s.confirmation === 'HMH298NMT5' ||
        s.confirmation === '2519510602'
      );

      if (!target) {
        document.getElementById('title').textContent = '⚠️ Record not found';
        document.getElementById('msg').textContent   = 'Could not find the Taormina stay.';
        return;
      }

      target.confirmation  = '2519510602';
      target.city          = 'Taormina';
      target.propertyTitle = 'Home in Taormina';
      target.host          = 'Hotel Villa Paradiso';

      await TripDB.update('stays', target);

      document.getElementById('title').textContent = '✅ Done!';
      document.getElementById('msg').textContent   = 'Confirmation set to 2519510602 — redirecting…';
      setTimeout(() => window.location.href = 'stays.html', 1500);
    })();
  </script>
</body>
</html>
