<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fixing Rome stay…</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Lato',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; background:#faf8f5; gap:1rem; }
    h2 { color:#2a1a0e; } p { color:#888; font-size:0.95rem; }
    pre { background:#fff; border:1px solid #e8ddd0; border-radius:8px; padding:1rem; font-size:0.78rem; max-width:90vw; overflow:auto; text-align:left; }
  </style>
</head>
<body>
  <h2 id="title">⏳ Fixing Rome stay…</h2>
  <p id="msg">Opening database…</p>
  <script src="db.js"></script>
  <script>
    (async () => {
      await TripDB.open();
      const all = await TripDB.getAll('stays');

      // Show all records for reference
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(all.map(s => ({ id: s.id, city: s.city, propertyTitle: s.propertyTitle, confirmation: s.confirmation, checkIn: s.checkIn })), null, 2);
      document.body.appendChild(pre);

      // Fix the record with confirmation 2519510602 that has checkIn Aug 24
      // (the Airbnb Rome stay — NOT the Hotel Villa Paradiso which is Aug 31)
      const target = all.find(s =>
        s.confirmation === '2519510602' &&
        /Aug\s*24/i.test(s.checkIn)
      );

      if (!target) {
        document.getElementById('title').textContent = '⚠️ Could not find record';
        document.getElementById('msg').textContent   = 'Check the list above — find the Rome Aug 24 stay and note its id.';
        return;
      }

      target.city          = 'Rome';
      target.propertyTitle = 'Home in Rome';
      target.host          = 'Bianca';
      target.address       = 'Via Francesco Crispi, 20, Rome, Lazio 00187, Italy';

      await TripDB.update('stays', target);
      document.getElementById('title').textContent = '✅ Fixed!';
      document.getElementById('msg').textContent   = 'Rome stay restored — redirecting…';
      setTimeout(() => window.location.href = 'stays.html', 1500);
    })();
  </script>
</body>
</html>
