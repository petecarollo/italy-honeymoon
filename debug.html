<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DB Debug</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Lato',sans-serif; padding:2rem; background:#faf8f5; }
    h2   { color:#2a1a0e; margin-bottom:1rem; }
    pre  { background:#fff; border:1px solid #e8ddd0; border-radius:8px; padding:1rem; font-size:0.8rem; overflow:auto; max-height:400px; white-space:pre-wrap; word-break:break-word; }
    .store-block { margin-bottom:2rem; }
    h3 { color:#8b5e3c; margin-bottom:0.5rem; }
    .count { font-size:0.85rem; color:#888; margin-bottom:0.5rem; }
    .btn { background:#2a1a0e; color:#e8d5b0; border:none; border-radius:8px; padding:0.6rem 1.2rem; font-size:0.9rem; cursor:pointer; margin-right:0.5rem; margin-bottom:1rem; }
    .btn:hover { background:#3d2610; }
    .status { color:#8b5e3c; font-weight:700; margin-top:0.5rem; }
  </style>
</head>
<body>
  <h2>🔍 IndexedDB Debug — Pete & Elise</h2>
  <p>This page shows everything currently stored in your browser's database.</p>
  <div style="margin-bottom:1.5rem;">
    <button class="btn" onclick="loadAll()">🔄 Refresh</button>
    <a href="stays.html" style="color:#8b5e3c;font-weight:700;">← Back to Stays</a>
  </div>
  <div id="output"></div>

  <script src="db.js"></script>
  <script>
    async function loadAll() {
      const output = document.getElementById('output');
      output.innerHTML = '<p>Loading…</p>';

      await TripDB.open();

      const stores = ['stays', 'transport', 'restaurants', 'excursions', 'costs-manual', 'itinerary'];
      let html = '';

      for (const store of stores) {
        let records = [];
        try { records = await TripDB.getAll(store); } catch(e) { records = []; }

        html += `<div class="store-block">
          <h3>${store}</h3>
          <p class="count">${records.length} record(s)</p>
          <pre>${records.length ? JSON.stringify(records.map(r => {
            // Show all fields except photo/preview (too large)
            const { photo, preview, ...rest } = r;
            return rest;
          }), null, 2) : '(empty)'}</pre>
        </div>`;
      }

      output.innerHTML = html;
    }

    loadAll();
  </script>
</body>
</html>
